<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Premium Pro</title>
    <style>
        /* Общие стили и фоновая заставка */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            /* Фоновая заставка с машиной */
            background: url('bmw.png') no-repeat center center/cover;
            overflow: hidden;
        }

        /* Темная подложка, чтобы интерфейс игры четко выделялся на фоне машины */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.65);
            z-index: 1;
        }

        /* Игровой контейнер поверх фона */
        .game-container {
            position: relative;
            z-index: 2;
            background: rgba(31, 40, 51, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(102, 252, 241, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            color: #66fcf1;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .game-status {
            font-size: 1.2rem;
            color: #c5c6c7;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .status-value {
            color: #66fcf1;
            font-weight: 700;
        }

        /* Временная шахматная доска (замените на ваш скрипт отрисовки) */
        .chessboard-placeholder {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 4px solid #45a29e;
            border-radius: 4px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            margin-bottom: 25px;
        }

        /* Пример шахматной клетки */
        .cell {
            background-color: rgba(255,255,255,0.1);
        }
        .cell:nth-child(odd) {
            background-color: rgba(0,0,0,0.2);
        }

        /* Стили кнопок управления */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #66fcf1;
            color: #0b0c10;
        }

        .btn-primary:hover {
            background-color: #45a29e;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #c5c6c7;
            border: 1px solid #c5c6c7;
        }

        .btn-secondary:hover {
            color: #ffffff;
            border-color: #ffffff;
            background-color: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Шапка игры на английском -->
        <h1>Chess Premium Pro</h1>
        
        <!-- Статусы на английском -->
        <div class="game-status">
            <div>Turn: <span class="status-value">White</span></div>
            <div>Mode: <span class="status-value">with Friend</span></div>
        </div>

        <!-- Поле для вашей шахматной доски -->
        <div class="chessboard-placeholder">
            <!-- Скрипт или элементы доски будут генерироваться здесь -->
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <!-- ... и так далее 64 клетки ... -->
        </div>

        <!-- Кнопки управления на английском -->
        <div class="controls">
            <button class="btn btn-primary">New Game</button>
            <button class="btn btn-secondary">Reset</button>
        </div>
    </div>

    <!-- Если у вас есть рабочий JS-скрипт игры, подключите его ниже -->
    <!-- <script src="chess.js"></script> -->

</body>
</html>
