<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Chess Online</title>
    <!-- Chessboard.js & Chess.js CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #262421;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        /* Board Container */
        .board-container {
            flex: 1;
            max-width: 560px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #312e2b;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .player-avatar {
            width: 35px;
            height: 35px;
            background: #45423e;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        #myBoard {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Chess.com Green Board Colors */
        .white-1e1d7 {
            background-color: #eeeed2 !important;
            color: #769656 !important;
        }
        .black-3c85d {
            background-color: #769656 !important;
            color: #eeeed2 !important;
        }

        /* Control Panel */
        .control-panel {
            width: 320px;
            background-color: #312e2b;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .panel-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            color: #fff;
        }

        .btn {
            background-color: #45423e;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: #57534e;
        }

        .btn-primary {
            background-color: #81b64c;
            color: #fff;
            justify-content: center;
        }

        .btn-primary:hover {
            background-color: #a3d168;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #262421;
            color: #fff;
            border: 1px solid #45423e;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }

        .status-box {
            background: #262421;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            color: #bababa;
        }

        /* Square Highlight Styles */
        .selected-square {
            background-color: #bbcb2b !important;
        }
        .possible-move-square {
            box-shadow: inset 0 0 0 4px rgba(20, 85, 30, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="board-container">
        <!-- Opponent -->
        <div class="player-tag">
            <div class="player-avatar">♟</div>
            <span id="opponentName">Opponent (Bot)</span>
        </div>

        <!-- Chess Board -->
        <div id="myBoard"></div>

        <!-- Player -->
        <div class="player-tag">
            <div class="player-avatar">♙</div>
            <span id="playerName">Player (White)</span>
        </div>
    </div>

    <!-- Right Control Panel -->
    <div class="control-panel">
        <div class="panel-title">Play Chess</div>

        <button class="btn" onclick="setMode('bot')">
            <span>🤖</span> Play Bots
        </button>

        <button class="btn" onclick="setMode('friend')">
            <span>🤝</span> Play a Friend (Pass & Play)
        </button>

        <div id="botSettings">
            <label style="font-size: 12px; color: #aaa; margin-bottom: 5px; display: block;">Bot Difficulty:</label>
            <select id="botDifficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="resetGame()">New Game</button>

        <div class="status-box" id="gameStatus">White to move</div>
    </div>
</div>

<!-- Dependencies -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    let gameMode = 'bot';
    let selectedSquare = null;

    const $status = $('#gameStatus');

    function removeHighlights () {
        $('#myBoard .square-55d63').removeClass('selected-square possible-move-square');
    }

    function addHighlights (square) {
        removeHighlights();
        $('#myBoard .square-' + square).addClass('selected-square');

        const moves = game.moves({ square: square, verbose: true });
        moves.forEach(m => {
            $('#myBoard .square-' + m.to).addClass('possible-move-square');
        });
    }

    function onSquareClick (square) {
        if (game.game_over()) return;

        // Prevent moving black pieces when playing vs Bot
        if (gameMode === 'bot' && game.turn() === 'b') return;

        const piece = game.get(square);

        // Click 1: Select piece to move
        if (selectedSquare === null) {
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                addHighlights(square);
            }
            return;
        }

        // Click 2: Execute move
        const move = game.move({
            from: selectedSquare,
            to: square,
            promotion: 'q'
        });

        // If clicked on another piece of the current turn's color, switch selection
        if (move === null && piece && piece.color === game.turn()) {
            selectedSquare = square;
            addHighlights(square);
            return;
        }

        // Successful move
        if (move !== null) {
            selectedSquare = null;
            removeHighlights();
            board.position(game.fen());
            updateStatus();

            if (gameMode === 'bot' && !game.game_over()) {
                window.setTimeout(makeBotMove, 250);
            }
        } else {
            selectedSquare = null;
            removeHighlights();
        }
    }

    function makeBotMove () {
        const possibleMoves = game.moves();
        if (possibleMoves.length === 0 || game.game_over()) return;

        const difficulty = $('#botDifficulty').val();
        let move;

        if (difficulty === 'easy') {
            const randomIdx = Math.floor(Math.random() * possibleMoves.length);
            move = possibleMoves[randomIdx];
        } else {
            const verboseMoves = game.moves({ verbose: true });
            const captures = verboseMoves.filter(m => m.captured);

            if (captures.length > 0 && (difficulty === 'hard' || Math.random() > 0.4)) {
                move = captures[Math.floor(Math.random() * captures.length)];
            } else {
                move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }
        }

        game.move(move);
        board.position(game.fen());
        updateStatus();
    }

    function updateStatus () {
        let status = '';
        let moveColor = (game.turn() === 'w') ? 'White' : 'Black';

        if (game.in_checkmate()) {
            status = 'Game over, CHECKMATE! ' + (game.turn() === 'w' ? 'Black' : 'White') + ' wins.';
        } else if (game.in_draw()) {
            status = 'Game over, DRAW!';
        } else {
            status = moveColor + ' to move';
            if (game.in_check()) {
                status += ' (CHECK!)';
            }
        }

        $status.html(status);
    }

    function setMode(mode) {
        gameMode = mode;
        if (mode === 'friend') {
            $('#opponentName').text('Friend (Black)');
            $('#botSettings').hide();
        } else {
            $('#opponentName').text('Opponent (Bot)');
            $('#botSettings').show();
        }
        resetGame();
    }

    function resetGame() {
        game.reset();
        board.start();
        selectedSquare = null;
        removeHighlights();
        updateStatus();
    }

    // Board Configuration with Dragging Disabled (Click-to-Move only)
    const config = {
        draggable: false,
        position: 'start',
        moveSpeed: 'slow',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };
    board = Chessboard('myBoard', config);

    // Bind click handlers to board squares
    $('#myBoard').on('click', '.square-55d63', function () {
        const square = $(this).attr('data-square');
        onSquareClick(square);
    });

    $(window).resize(board.resize);
    updateStatus();
</script>

</body>
</html>
