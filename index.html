<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppSphere - Games & Apps</title>
    
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg-dark: #100a1c;
            --bg-card: #1d1536;
            --bg-card-hover: #291e4a;
            --primary: #ff6b00;
            --primary-hover: #ff8533;
            --purple-accent: #6c5ce7;
            --text-light: #ffffff;
            --text-muted: #a29bfe;
            --border: #2d224e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #160d29;
            border-bottom: 2px solid var(--border);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 10px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 107, 0, 0.4);
        }

        .brand-name {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b00, #ff9f43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        .nav-link {
            background: #241943;
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        /* Views */
        .app-view {
            display: none;
            width: 100%;
            padding: 20px;
            justify-content: center;
        }

        .app-view.active-view {
            display: flex;
        }

        /* Chessboard UI */
        .chess-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .board-container {
            flex: 1;
            max-width: 560px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #312e2b;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .player-avatar {
            width: 35px;
            height: 35px;
            background: #45423e;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        #myBoard {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .white-1e1d7 {
            background-color: #eeeed2 !important;
            color: #769656 !important;
        }
        .black-3c85d {
            background-color: #769656 !important;
            color: #eeeed2 !important;
        }

        .control-panel {
            width: 320px;
            background-color: #312e2b;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .panel-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            color: #fff;
        }

        .btn {
            background-color: #45423e;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover { background-color: #57534e; }

        .btn-primary {
            background-color: #81b64c;
            color: #fff;
            justify-content: center;
        }

        .btn-primary:hover { background-color: #a3d168; }

        .mode-select-custom {
            width: 100%;
            padding: 10px;
            background: #262421;
            color: #fff;
            border: 1px solid #45423e;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }

        .status-box {
            background: #262421;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            color: #bababa;
        }

        .selected-square {
            background-color: #bbcb2b !important;
        }
        .possible-move-square {
            box-shadow: inset 0 0 0 4px rgba(20, 85, 30, 0.5);
        }

        /* Catalog Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 20px auto;
            width: 100%;
            padding: 0 20px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--purple-accent);
        }

        .card-preview {
            height: 130px;
            background: #2b1f4c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .card-body { padding: 15px; }
        .card-title { font-weight: 700; margin-bottom: 5px; }
        .card-desc { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="brand-container" onclick="openHome()">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" width="30" height="30">
                    <ellipse cx="25" cy="40" rx="12" ry="16" fill="url(#orangeGrad)" />
                    <ellipse cx="50" cy="28" rx="13" ry="18" fill="url(#orangeGrad)" />
                    <ellipse cx="75" cy="40" rx="12" ry="16" fill="url(#orangeGrad)" />
                    <path d="M 20,62 C 25,48 40,42 50,42 C 60,42 75,48 80,62 C 85,76 75,85 50,85 C 25,85 15,76 20,62 Z" fill="url(#orangeGrad)" />
                    <path d="M 44,85 L 44,72 C 44,68 56,68 56,72 L 56,85 Z" fill="#ffffff" />
                    <defs>
                        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ff9f43" />
                            <stop offset="100%" stop-color="#ff6b00" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="brand-name">AppSphere</div>
        </div>

        <nav id="nav-bar">
            <button class="nav-link active" onclick="openHome()">Home</button>
        </nav>
    </header>

    <!-- Home Catalog -->
    <div id="view-home" style="display: block;">
        <div class="grid" id="games-grid"></div>
    </div>

    <!-- Iframe Container for External Apps -->
    <div id="view-dynamic-iframe" class="app-view">
        <iframe id="app-iframe" src="" style="width: 100%; height: 80vh; border: none; border-radius: 12px;"></iframe>
    </div>

    <!-- Chess Game View -->
    <div id="view-chess" class="app-view">
        <div class="chess-container">
            <div class="board-container">
                <div class="player-tag">
                    <div class="player-avatar">♟</div>
                    <span id="opponentName">Opponent (Bot)</span>
                </div>

                <div id="myBoard"></div>

                <div class="player-tag">
                    <div class="player-avatar">♙</div>
                    <span id="playerName">Player (White)</span>
                </div>
            </div>

            <div class="control-panel">
                <div class="panel-title">Play Chess</div>

                <button class="btn" onclick="setMode('bot')">
                    <span>🤖</span> Play Bots
                </button>

                <button class="btn" onclick="setMode('friend')">
                    <span>🤝</span> Play a Friend (Pass & Play)
                </button>

                <div id="botSettings">
                    <label style="font-size: 12px; color: #aaa; margin-bottom: 5px; display: block;">Bot Difficulty:</label>
                    <select id="botDifficulty" class="mode-select-custom">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="resetGame()">New Game</button>

                <div class="status-box" id="gameStatus">White to move</div>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        let allGames = [];
        let board = null;
        let game = new Chess();
        let gameMode = 'bot';
        let selectedSquare = null;

        // Load catalog dynamically
        async function loadGamesList() {
            try {
                const response = await fetch('games.json');
                allGames = await response.json();
                renderCatalog();
            } catch (error) {
                console.error("Error loading games.json:", error);
            }
        }

        function renderCatalog() {
            const grid = document.getElementById('games-grid');
            const navBar = document.getElementById('nav-bar');
            
            grid.innerHTML = '';
            navBar.innerHTML = '<button class="nav-link active" onclick="openHome()">Home</button>';

            allGames.forEach(g => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openGame(g.id);
                card.innerHTML = `
                    <div class="card-preview">${g.icon || '🎮'}</div>
                    <div class="card-body">
                        <div class="card-title">${g.title}</div>
                        <div class="card-desc">${g.desc || ''}</div>
                    </div>
                `;
                grid.appendChild(card);

                const navBtn = document.createElement('button');
                navBtn.className = 'nav-link';
                navBtn.dataset.gameId = g.id;
                navBtn.textContent = g.title;
                navBtn.onclick = () => openGame(g.id);
                navBar.appendChild(navBtn);
            });
        }

        function openHome() {
            document.getElementById('view-home').style.display = 'block';
            document.getElementById('view-chess').classList.remove('active-view');
            document.getElementById('view-dynamic-iframe').classList.remove('active-view');
            
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.nav-link')[0].classList.add('active');
        }

        function openGame(gameId) {
            const g = allGames.find(item => item.id === gameId);
            if (!g) return;

            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-chess').classList.remove('active-view');
            document.getElementById('view-dynamic-iframe').classList.remove('active-view');

            document.querySelectorAll('.nav-link').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.gameId === gameId);
            });

            if (g.type === 'internal' && g.id === 'chess') {
                document.getElementById('view-chess').classList.add('active-view');
                if (board) board.resize();
            } else if (g.file) {
                const iframe = document.getElementById('app-iframe');
                iframe.src = g.file;
                document.getElementById('view-dynamic-iframe').classList.add('active-view');
            }
        }

        /* --- Chess Engine Logic --- */
        const $status = $('#gameStatus');

        function removeHighlights () {
            $('#myBoard .square-55d63').removeClass('selected-square possible-move-square');
        }

        function addHighlights (square) {
            removeHighlights();
            $('#myBoard .square-' + square).addClass('selected-square');

            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(m => {
                $('#myBoard .square-' + m.to).addClass('possible-move-square');
            });
        }

        function onSquareClick (square) {
            if (game.game_over()) return;

            if (gameMode === 'bot' && game.turn() === 'b') return;

            const piece = game.get(square);

            if (selectedSquare === null) {
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    addHighlights(square);
                }
                return;
            }

            const move = game.move({
                from: selectedSquare,
                to: square,
                promotion: 'q'
            });

            if (move === null && piece && piece.color === game.turn()) {
                selectedSquare = square;
                addHighlights(square);
                return;
            }

            if (move !== null) {
                selectedSquare = null;
                removeHighlights();
                board.position(game.fen());
                updateStatus();

                if (gameMode === 'bot' && !game.game_over()) {
                    window.setTimeout(makeBotMove, 250);
                }
            } else {
                selectedSquare = null;
                removeHighlights();
            }
        }

        function makeBotMove () {
            const possibleMoves = game.moves();
            if (possibleMoves.length === 0 || game.game_over()) return;

            const difficulty = $('#botDifficulty').val();
            let move;

            if (difficulty === 'easy') {
                const randomIdx = Math.floor(Math.random() * possibleMoves.length);
                move = possibleMoves[randomIdx];
            } else {
                const verboseMoves = game.moves({ verbose: true });
                const captures = verboseMoves.filter(m => m.captured);

                if (captures.length > 0 && (difficulty === 'hard' || Math.random() > 0.4)) {
                    move = captures[Math.floor(Math.random() * captures.length)];
                } else {
                    move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                }
            }

            game.move(move);
            board.position(game.fen());
            updateStatus();
        }

        function updateStatus () {
            let status = '';
            let moveColor = (game.turn() === 'w') ? 'White' : 'Black';

            if (game.in_checkmate()) {
                status = 'Game over, CHECKMATE! ' + (game.turn() === 'w' ? 'Black' : 'White') + ' wins.';
            } else if (game.in_draw()) {
                status = 'Game over, DRAW!';
            } else {
                status = moveColor + ' to move';
                if (game.in_check()) {
                    status += ' (CHECK!)';
                }
            }

            $status.html(status);
        }

        function setMode(mode) {
            gameMode = mode;
            if (mode === 'friend') {
                $('#opponentName').text('Friend (Black)');
                $('#botSettings').hide();
            } else {
                $('#opponentName').text('Opponent (Bot)');
                $('#botSettings').show();
            }
            resetGame();
        }

        function resetGame() {
            game.reset();
            board.start();
            selectedSquare = null;
            removeHighlights();
            updateStatus();
        }

        // Initialize Board
        const config = {
            draggable: false,
            position: 'start',
            moveSpeed: 'slow',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('myBoard', config);

        $('#myBoard').on('click', '.square-55d63', function () {
            const square = $(this).attr('data-square');
            onSquareClick(square);
        });

        $(window).resize(board.resize);

        // Start
        loadGamesList();
        updateStatus();
    </script>
</body>
</html>
