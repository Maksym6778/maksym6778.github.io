<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Library</title>
    <style>
        :root {
            --card-bg: rgba(17, 24, 39, 0.85);
            --text-main: #ffffff;
            --text-muted: #d1d5db;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: rgba(31, 41, 55, 0.5);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            /* Подключаем картинку с машиной на фон */
            background: url('bmw.png') no-repeat center center/cover;
            background-attachment: fixed;
        }
        /* Затемнение для читаемости текста на фоне машины */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.6);
            z-index: 1;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.25);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .card-icon {
            width: 40px;
            height: 40px;
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0;
        }
        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0.5rem 0 0 0;
            line-height: 1.4;
        }
        .card-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Games</h1>
    <p class="subtitle">Play interactive browser games built for the modern experience.</p>
    <div class="grid">
        <!-- Chess Card -->
        <a href="/chess/index.html" class="card">
            <div>
                <div class="card-header">
                    <div class="card-icon">♞</div>
                    <span class="card-badge">Strategy</span>
                </div>
                <h3 class="card-title">Chess</h3>
                <p class="card-desc">Classic chess game. Test your tactical skills against the AI or your friends.</p>
            </div>
        </a>
    </div>
</div>
</body>
</html>
