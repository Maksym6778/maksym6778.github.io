<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess.com Edition - ArcadeHub</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #262421;
            --square-light: #ebecd0;
            --square-dark: #739552;
            --square-select: #f7ec59;
            --square-check: #ef4444;
            --square-move-dot: rgba(20, 85, 30, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
            padding: 15px;
            overflow-x: hidden;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 512px;
            margin-bottom: 12px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #bababa;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            width: 100%;
            max-width: 512px;
            justify-content: center;
        }

        #turn-indicator {
            font-size: 0.9rem;
            background: #312e2b;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            border: 1px solid #403d39;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e5e7eb;
        }

        #mode-btn {
            padding: 8px 16px;
            background: #81b64c;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(129, 182, 76, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #mode-btn:hover {
            background: #a3d16b;
            transform: translateY(-2px);
        }

        /* Player Bar Component */
        .player-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 512px;
            padding: 8px 12px;
            background: #312e2b;
            border-radius: 6px;
            margin: 4px 0;
        }

        .avatar {
            width: 34px;
            height: 34px;
            background: #45423e;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #bababa;
        }

        .player-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
        }

        /* Chess Board Container */
        #board-wrapper {
            position: relative;
            width: 416px;
            height: 416px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 540px) {
            #board-wrapper {
                width: 512px;
                height: 512px;
            }
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 52px);
            grid-template-rows: repeat(8, 52px);
            width: 100%;
            height: 100%;
        }

        @media (min-width: 540px) {
            #board {
                grid-template-columns: repeat(8, 64px);
                grid-template-rows: repeat(8, 64px);
            }
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .square-light { background-color: var(--square-light); }
        .square-dark { background-color: var(--square-dark); }

        .square.selected { background-color: var(--square-select) !important; }

        .square.in-check {
            background-color: var(--square-check) !important;
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from { background-color: #ef4444; }
            to { background-color: #991b1b; }
        }

        /* Chess.com Coordinates */
        .coord {
            position: absolute;
            font-size: 11px;
            font-weight: 700;
            pointer-events: none;
            user-select: none;
        }
        .coord-rank {
            top: 2px;
            left: 4px;
        }
        .coord-file {
            bottom: 2px;
            right: 4px;
        }
        .square-light .coord { color: var(--square-dark); }
        .square-dark .coord { color: var(--square-light); }

        .dot {
            width: 18px;
            height: 18px;
            background-color: var(--square-move-dot);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }

        /* Separate Animation Layer for Smooth Movement */
        #pieces-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .piece-img {
            position: absolute;
            width: 52px;
            height: 52px;
            top: 0;
            left: 0;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        @media (min-width: 540px) {
            .piece-img {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>

<body>

    <div class="header-bar">
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Hub</a>
        <h1>Chess.com Edition</h1>
    </div>

    <div class="controls">
        <div id="turn-indicator"><i class="fa-solid fa-chess-king"></i> Turn: White</div>
        <button id="mode-btn" onclick="toggleMode()"><i class="fa-solid fa-user-group"></i> Mode: vs Friend</button>
    </div>

    <!-- Opponent Info -->
    <div class="player-bar">
        <div class="avatar"><i class="fa-solid fa-user-ninja"></i></div>
        <div class="player-name" id="opponent-name">Opponent (Black)</div>
    </div>

    <!-- Board Wrapper -->
    <div id="board-wrapper">
        <div id="board"></div>
        <div id="pieces-layer"></div>
    </div>

    <!-- Player Info -->
    <div class="player-bar">
        <div class="avatar"><i class="fa-solid fa-user"></i></div>
        <div class="player-name">Player (White)</div>
    </div>

    <script>
        const P = { NONE: 0, PAWN: 1, KNIGHT: 2, BISHOP: 3, ROOK: 4, QUEEN: 5, KING: 6, W: 8, B: 16 };
        
        let board = Array(64).fill(0),
            turn = P.W,
            selectedSquare = null,
            possibleMoves = [],
            enPassant = null,
            castling = { wK: true, wQ: true, bK: true, bQ: true },
            halfmove = 0,
            history = [],
            vsAI = false,
            isAnimating = false,
            pieceElementsMap = {};

        // Official High Quality Chess Vector Images (Wikimedia Cburnett set used by Lichess & Chess.com)
        const pieceImgUrls = {
            'w1': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
            'w4': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
            'w2': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
            'w3': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
            'w5': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
            'w6': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',

            'b1': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
            'b4': 'https://upload.wikimedia.org/wikipedia/commons/ff/ff/Chess_rdt45.svg',
            'b2': 'https://upload.wikimedia.org/wikipedia/commons/ef/ef/Chess_ndt45.svg',
            'b3': 'https://upload.wikimedia.org/wikipedia/commons/9/9b/Chess_bdt45.svg',
            'b5': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
            'b6': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        };

        function getSquareSize() {
            return window.innerWidth >= 540 ? 64 : 52;
        }

        function initBoard() {
            board.fill(0);
            const row = [P.ROOK, P.KNIGHT, P.BISHOP, P.QUEEN, P.KING, P.BISHOP, P.KNIGHT, P.ROOK];
            for (let i = 0; i < 8; i++) {
                board[i] = row[i] | P.B;
                board[8 + i] = P.PAWN | P.B;
                board[48 + i] = P.PAWN | P.W;
                board[56 + i] = row[i] | P.W;
            }
            turn = P.W;
            selectedSquare = null;
            possibleMoves = [];
            enPassant = null;
            castling = { wK: true, wQ: true, bK: true, bQ: true };
            halfmove = 0;
            history = [board.join(',')];
            renderPieces();
        }

        function renderPieces() {
            const layer = document.getElementById('pieces-layer');
            layer.innerHTML = '';
            pieceElementsMap = {};
            const sqSize = getSquareSize();

            for (let i = 0; i < 64; i++) {
                if (board[i]) {
                    const el = document.createElement('div');
                    el.className = 'piece-img';
                    const colorPrefix = (board[i] & P.W) ? 'w' : 'b';
                    const pieceType = board[i] & 7;
                    
                    el.style.backgroundImage = `url("${pieceImgUrls[`${colorPrefix}${pieceType}`]}")`;
                    
                    const r = Math.floor(i / 8);
                    const c = i % 8;
                    el.style.transform = `translate3d(${c * sqSize}px, ${r * sqSize}px, 0)`;
                    
                    layer.appendChild(el);
                    pieceElementsMap[i] = el;
                }
            }
        }

        function smoothMovePiece(from, to, callback) {
            isAnimating = true;
            const sqSize = getSquareSize();
            const pieceEl = pieceElementsMap[from];
            const capturedEl = pieceElementsMap[to];

            const targetRow = Math.floor(to / 8);
            const targetCol = to % 8;

            if (capturedEl) {
                capturedEl.style.opacity = '0';
            }

            if (pieceEl) {
                pieceEl.style.transform = `translate3d(${targetCol * sqSize}px, ${targetRow * sqSize}px, 0)`;
            }

            setTimeout(() => {
                makeMove(from, to);
                renderPieces();
                drawBoard();
                isAnimating = false;
                if (callback) callback();
            }, 250);
        }

        function toggleMode() {
            if (isAnimating) return;
            vsAI = !vsAI;
            const modeBtn = document.getElementById('mode-btn');
            const oppName = document.getElementById('opponent-name');
            if (vsAI) {
                modeBtn.innerHTML = '<i class="fa-solid fa-robot"></i> Mode: vs Bot';
                oppName.innerHTML = 'Bot AI (Black)';
            } else {
                modeBtn.innerHTML = '<i class="fa-solid fa-user-group"></i> Mode: vs Friend';
                oppName.innerHTML = 'Friend (Black)';
            }
            resetGame();
        }

        function resetGame() {
            initBoard();
            drawBoard();
        }

        function generateMoves(from, fBoard = board, fCastling = castling, fEP = enPassant) {
            let moves = [], pc = fBoard[from];
            if (!pc) return moves;
            let type = pc & 7, col = pc & 24, enemy = col === P.W ? P.B : P.W, r = Math.floor(from / 8), c = from % 8;

            if (type === P.PAWN) {
                let dir = col === P.W ? -1 : 1, start = col === P.W ? 6 : 1, nxt = from + dir * 8;
                if (nxt >= 0 && nxt < 64 && !fBoard[nxt]) {
                    moves.push(nxt);
                    if (r === start && !fBoard[from + dir * 16]) moves.push(from + dir * 16);
                }
                for (let side of [-1, 1]) {
                    let att = from + dir * 8 + side;
                    if (att >= 0 && att < 64 && Math.abs((att % 8) - c) === 1) {
                        if ((fBoard[att] && (fBoard[att] & 24) === enemy) || att === fEP) moves.push(att);
                    }
                }
            } else if (type === P.KNIGHT) {
                for (let o of [-17, -15, -10, -6, 6, 10, 15, 17]) {
                    let tc = from + o;
                    if (tc >= 0 && tc < 64 && Math.max(Math.abs((tc % 8) - c), Math.abs(Math.floor(tc / 8) - r)) <= 2 && (!fBoard[tc] || !(fBoard[tc] & col))) moves.push(tc);
                }
            } else if (type === P.KING) {
                for (let o of [-9, -8, -7, -1, 1, 7, 8, 9]) {
                    let tc = from + o;
                    if (tc >= 0 && tc < 64 && Math.max(Math.abs((tc % 8) - c), Math.abs(Math.floor(tc / 8) - r)) === 1 && (!fBoard[tc] || !(fBoard[tc] & col))) moves.push(tc);
                }
                if (fBoard === board) {
                    if (col === P.W && from === 60) {
                        if (fCastling.wK && !board[61] && !board[62] && !isAttacked(60, P.B) && !isAttacked(61, P.B) && !isAttacked(62, P.B)) moves.push(62);
                        if (fCastling.wQ && !board[59] && !board[58] && !board[57] && !isAttacked(60, P.B) && !isAttacked(59, P.B) && !isAttacked(58, P.B)) moves.push(58);
                    } else if (col === P.B && from === 4) {
                        if (fCastling.bK && !board[5] && !board[6] && !isAttacked(4, P.W) && !isAttacked(5, P.W) && !isAttacked(6, P.W)) moves.push(6);
                        if (fCastling.bQ && !board[3] && !board[2] && !board[1] && !isAttacked(4, P.W) && !isAttacked(3, P.W) && !isAttacked(2, P.W)) moves.push(2);
                    }
                }
            } else {
                let dirs = [];
                if (type === P.BISHOP || type === P.QUEEN) dirs.push([-1, -1], [-1, 1], [1, -1], [1, 1]);
                if (type === P.ROOK || type === P.QUEEN) dirs.push([-1, 0], [1, 0], [0, -1], [0, 1]);
                for (let d of dirs) {
                    let cr = r, cc = c;
                    while (true) {
                        cr += d[0]; cc += d[1];
                        if (cr < 0 || cr >= 8 || cc < 0 || cc >= 8) break;
                        let tc = cr * 8 + cc;
                        if (!fBoard[tc]) moves.push(tc);
                        else {
                            if ((fBoard[tc] & 24) === enemy) moves.push(tc);
                            break;
                        }
                    }
                }
            }
            return moves;
        }

        function isAttacked(sq, byCol, fBoard = board) {
            for (let i = 0; i < 64; i++) {
                if ((fBoard[i] & 24) === byCol && generateMoves(i, fBoard, castling, null).includes(sq)) return true;
            }
            return false;
        }

        function getKing(col, fBoard = board) {
            for (let i = 0; i < 64; i++) {
                if ((fBoard[i] & 7) === P.KING && (fBoard[i] & 24) === col) return i;
            }
            return -1;
        }

        function makeMove(from, to) {
            let pc = board[from], type = pc & 7, col = pc & 24, isCap = board[to] !== 0 || (type === P.PAWN && to === enPassant);

            if (type === P.PAWN && to === enPassant) board[to + (col === P.W ? 8 : -8)] = 0;
            if (type === P.KING) {
                if (from === 60 && to === 62) { board[61] = board[63]; board[63] = 0; }
                if (from === 60 && to === 58) { board[59] = board[56]; board[56] = 0; }
                if (from === 4 && to === 6) { board[5] = board[7]; board[7] = 0; }
                if (from === 4 && to === 2) { board[3] = board[0]; board[0] = 0; }
                if (col === P.W) castling.wK = castling.wQ = false;
                else castling.bK = castling.bQ = false;
            }
            if (type === P.ROOK) {
                if (from === 56) castling.wQ = false;
                if (from === 63) castling.wK = false;
                if (from === 0) castling.bQ = false;
                if (from === 7) castling.bK = false;
            }
            if (to === 56) castling.wQ = false;
            if (to === 63) castling.wK = false;
            if (to === 0) castling.bQ = false;
            if (to === 7) castling.bK = false;

            board[to] = pc;
            board[from] = 0;
            enPassant = (type === P.PAWN && Math.abs(to - from) === 16) ? to + (col === P.W ? 8 : -8) : null;
            if (type === P.PAWN && (Math.floor(to / 8) === 0 || Math.floor(to / 8) === 7)) board[to] = P.QUEEN | col;
            halfmove = (type === P.PAWN || isCap) ? 0 : halfmove + 1;
            turn = turn === P.W ? P.B : P.W;
            history.push(board.join(','));
        }

        function getLegalMoves(from) {
            let raw = generateMoves(from), legal = [], col = board[from] & 24;
            for (let to of raw) {
                let saved = [...board], savedC = { ...castling }, savedEP = enPassant;
                if ((board[from] & 7) === P.PAWN && to === enPassant) board[to + (col === P.W ? 8 : -8)] = 0;
                board[to] = board[from]; board[from] = 0;
                let kingSq = getKing(col);
                if (kingSq !== -1 && !isAttacked(kingSq, col === P.W ? P.B : P.W)) legal.push(to);
                board = saved; castling = savedC; enPassant = savedEP;
            }
            return legal;
        }

        function hasMoves(col) {
            for (let i = 0; i < 64; i++) {
                if ((board[i] & 24) === col && getLegalMoves(i).length > 0) return true;
            }
            return false;
        }

        function isDraw() {
            if (halfmove >= 100) return "Draw: 50 moves!";
            if (history.filter(x => x === board.join(',')).length >= 3) return "Draw: Repetition!";
            return null;
        }

        function makeAIMove() {
            let piecesValues = { [P.PAWN]: 10, [P.KNIGHT]: 30, [P.BISHOP]: 30, [P.ROOK]: 50, [P.QUEEN]: 90, [P.KING]: 900 };
            let allMoves = [];
            for (let i = 0; i < 64; i++) {
                if (board[i] && (board[i] & P.B)) {
                    let moves = getLegalMoves(i);
                    for (let m of moves) allMoves.push({ from: i, to: m });
                }
            }
            if (allMoves.length === 0) return;
            allMoves.forEach(mv => {
                let score = 0;
                let targetPiece = board[mv.to];
                if (targetPiece) score += piecesValues[targetPiece & 7] * 2;
                let currentPieceType = board[mv.from] & 7;
                if (currentPieceType === P.PAWN) score += (Math.floor(mv.to / 8));
                mv.score = score + (Math.random() * 3);
            });
            allMoves.sort((a, b) => b.score - a.score);
            let bestMove = allMoves[0];
            smoothMovePiece(bestMove.from, bestMove.to);
        }

        function drawBoard() {
            const el = document.getElementById('board');
            el.innerHTML = '';
            let kingCheck = isAttacked(getKing(turn), turn === P.W ? P.B : P.W);
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

            for (let i = 0; i < 64; i++) {
                const sq = document.createElement('div');
                let r = Math.floor(i / 8), c = i % 8;
                const isLight = (r + c) % 2 === 0;
                sq.classList.add('square', isLight ? 'square-light' : 'square-dark');
                
                // Chess.com Rank Labels (1-8)
                if (c === 0) {
                    const rankLabel = document.createElement('span');
                    rankLabel.className = 'coord coord-rank';
                    rankLabel.textContent = 8 - r;
                    sq.appendChild(rankLabel);
                }

                // Chess.com File Labels (a-h)
                if (r === 7) {
                    const fileLabel = document.createElement('span');
                    fileLabel.className = 'coord coord-file';
                    fileLabel.textContent = files[c];
                    sq.appendChild(fileLabel);
                }

                if (selectedSquare === i) sq.classList.add('selected');
                if (kingCheck && (board[i] & 7) === P.KING && (board[i] & 24) === turn) sq.classList.add('in-check');
                
                if (possibleMoves.includes(i)) {
                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    sq.appendChild(dot);
                }

                sq.addEventListener('click', () => {
                    if (isAnimating) return;
                    if (vsAI && turn === P.B) return;
                    if (!hasMoves(P.W) && !hasMoves(P.B)) return;

                    if (selectedSquare === null) {
                        if (board[i] && (board[i] & 24) === turn) {
                            selectedSquare = i;
                            possibleMoves = getLegalMoves(i);
                            drawBoard();
                        }
                    } else {
                        if (possibleMoves.includes(i)) {
                            const from = selectedSquare;
                            selectedSquare = null;
                            possibleMoves = [];
                            drawBoard();
                            smoothMovePiece(from, i, () => {
                                if (vsAI && turn === P.B) setTimeout(makeAIMove, 250);
                            });
                        } else if (board[i] && (board[i] & 24) === turn) {
                            selectedSquare = i;
                            possibleMoves = getLegalMoves(i);
                            drawBoard();
                        } else {
                            selectedSquare = null;
                            possibleMoves = [];
                            drawBoard();
                        }
                    }
                });
                el.appendChild(sq);
            }

            const ind = document.getElementById('turn-indicator');
            let hm = hasMoves(turn), dr = isDraw();
            if (!hm) {
                ind.innerHTML = kingCheck ? `<i class="fa-solid fa-trophy"></i> Checkmate! Restart in 5s...` : '<i class="fa-solid fa-handshake"></i> Stalemate! Restart...';
                ind.style.backgroundColor = kingCheck ? '#81b64c' : '#45423e';
                setTimeout(resetGame, 5000);
            } else if (dr) {
                ind.innerHTML = `<i class="fa-solid fa-handshake"></i> ${dr} Restart...`;
                ind.style.backgroundColor = '#45423e';
                setTimeout(resetGame, 5000);
            } else {
                ind.innerHTML = `<i class="fa-solid fa-chess-king"></i> Turn: ${turn===P.W?'White':'Black'}${kingCheck?' (CHECK!)':''}`;
                ind.style.backgroundColor = '#312e2b';
            }
        }

        window.addEventListener('resize', () => {
            renderPieces();
        });

        initBoard();
        drawBoard();
    </script>
</body>
</html>
